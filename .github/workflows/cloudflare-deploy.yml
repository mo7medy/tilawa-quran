name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      site_host:
        description: 'Cloudflare hostname without https://'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_PUBLIC_DEPLOYMENT_TARGET: cloudflare
      NEXT_PUBLIC_VERCEL_ENV: production
      NEXT_PUBLIC_VERCEL_URL: ${{ inputs.site_host }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies and remove download cache
        run: |
          yarn install --frozen-lockfile --non-interactive --ignore-scripts
          yarn cache clean
          df -h .
      - name: Check production TypeScript
        run: yarn tsc --project tsconfig.build.json --noEmit
      - name: Test content API and reading behavior
        run: yarn test src/lib/quranFoundation src/components/HomePage/ReadingSection/index.test.tsx
      - name: Build Cloudflare Worker
        run: yarn build:cloudflare
      - name: Deploy Worker and populate R2 cache
        run: yarn opennextjs-cloudflare deploy
