name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Match the application's Node.js engine and Cloudflare build runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Validate AI standards links
        run: yarn ai:check
      - name: Run tests
        run: yarn test
